<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg9" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#150000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg9)"/>
  <!-- Deep dark ground -->
  <rect x="0" y="750" width="1920" height="330" fill="#0a0000"/>
  <!-- Red mist/fog at bottom -->
  <ellipse cx="960" cy="800" rx="900" ry="150" fill="#440000" opacity="0.3" filter="url(#redBlur)"/>
  <!-- Entity silhouettes - malware creatures in the darkness -->
  <!-- Large center creature -->
  <g filter="url(#glow9)">
    <!-- Center large entity -->
    <ellipse cx="960" cy="700" rx="120" ry="80" fill="#1a0000" opacity="0.9"/>
    <ellipse cx="960" cy="650" rx="80" ry="60" fill="#220000"/>
    <ellipse cx="960" cy="610" rx="50" ry="40" fill="#330000"/>
    <!-- Red eyes -->
    <circle cx="935" cy="620" r="12" fill="#ff1100" filter="url(#glow9)"/>
    <circle cx="985" cy="620" r="12" fill="#ff1100" filter="url(#glow9)"/>
    <!-- Jagged body protrusions -->
    <polygon points="860,680 840,640 870,660" fill="#1a0000"/>
    <polygon points="820,710 790,660 830,690" fill="#150000"/>
    <polygon points="1060,680 1080,640 1050,660" fill="#1a0000"/>
    <polygon points="1100,710 1130,660 1090,690" fill="#150000"/>
    <!-- Claws/appendages -->
    <path d="M 900 700 Q 800 680 700 700 Q 650 710 600 700" stroke="#1a0000" stroke-width="8" fill="none"/>
    <path d="M 1020 700 Q 1120 680 1220 700 Q 1270 710 1320 700" stroke="#1a0000" stroke-width="8" fill="none"/>
  </g>
  <!-- Left background entities -->
  <g opacity="0.7" filter="url(#glow9)">
    <ellipse cx="350" cy="720" rx="70" ry="50" fill="#120000"/>
    <ellipse cx="350" cy="690" rx="45" ry="35" fill="#180000"/>
    <circle cx="330" cy="670" r="8" fill="#ff0000"/>
    <circle cx="370" cy="670" r="8" fill="#ff0000"/>
    <ellipse cx="150" cy="760" rx="60" ry="40" fill="#100000"/>
    <circle cx="135" cy="740" r="6" fill="#dd0000"/>
    <circle cx="165" cy="740" r="6" fill="#dd0000"/>
    <ellipse cx="550" cy="740" rx="55" ry="38" fill="#110000"/>
    <circle cx="530" cy="720" r="7" fill="#ee0000"/>
    <circle cx="570" cy="720" r="7" fill="#ee0000"/>
  </g>
  <!-- Right background entities -->
  <g opacity="0.7" filter="url(#glow9)">
    <ellipse cx="1570" cy="720" rx="70" ry="50" fill="#120000"/>
    <ellipse cx="1570" cy="690" rx="45" ry="35" fill="#180000"/>
    <circle cx="1550" cy="670" r="8" fill="#ff0000"/>
    <circle cx="1590" cy="670" r="8" fill="#ff0000"/>
    <ellipse cx="1770" cy="760" rx="60" ry="40" fill="#100000"/>
    <circle cx="1755" cy="740" r="6" fill="#dd0000"/>
    <circle cx="1785" cy="740" r="6" fill="#dd0000"/>
    <ellipse cx="1370" cy="740" rx="55" ry="38" fill="#110000"/>
    <circle cx="1350" cy="720" r="7" fill="#ee0000"/>
    <circle cx="1390" cy="720" r="7" fill="#ee0000"/>
  </g>
  <!-- Small distant entities with red eyes only (many eyes in darkness) -->
  <g fill="#cc0000" filter="url(#glow9)" opacity="0.6">
    <circle cx="250" cy="820" r="4"/><circle cx="270" cy="820" r="4"/>
    <circle cx="450" cy="840" r="3"/><circle cx="470" cy="840" r="3"/>
    <circle cx="650" cy="810" r="4"/><circle cx="670" cy="810" r="4"/>
    <circle cx="1250" cy="810" r="4"/><circle cx="1270" cy="810" r="4"/>
    <circle cx="1450" cy="840" r="3"/><circle cx="1470" cy="840" r="3"/>
    <circle cx="1650" cy="820" r="4"/><circle cx="1670" cy="820" r="4"/>
    <circle cx="100" cy="870" r="3"/><circle cx="120" cy="870" r="3"/>
    <circle cx="1800" cy="870" r="3"/><circle cx="1820" cy="870" r="3"/>
    <circle cx="800" cy="860" r="3"/><circle cx="820" cy="860" r="3"/>
    <circle cx="1100" cy="860" r="3"/><circle cx="1120" cy="860" r="3"/>
  </g>
  <!-- Corruption fragments floating -->
  <g fill="#330000" font-family="monospace" font-size="16" opacity="0.4">
    <text x="200" y="500">MALWARE_ENTITY_0xA4F2</text>
    <text x="1100" y="450">SPAWN_RATE: ∞</text>
    <text x="600" y="600">CONSUMING...</text>
    <text x="1200" y="580">DEVOURING...</text>
  </g>
  <!-- Central entity red glow aura -->
  <ellipse cx="960" cy="650" rx="200" ry="120" fill="#660000" opacity="0.15" filter="url(#redBlur)"/>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 09</text>
</svg>
