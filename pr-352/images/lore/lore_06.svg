<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001530"/>
      <stop offset="70%" stop-color="#000a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg6)"/>
  <!-- Particle field in background -->
  <g fill="#224488" opacity="0.3">
    <circle cx="120" cy="150" r="2"/><circle cx="350" cy="80" r="1"/><circle cx="580" cy="200" r="2"/>
    <circle cx="780" cy="100" r="1"/><circle cx="1100" cy="160" r="2"/><circle cx="1350" cy="90" r="1"/>
    <circle cx="1550" cy="180" r="2"/><circle cx="1800" cy="120" r="1"/><circle cx="200" cy="350" r="2"/>
    <circle cx="450" cy="280" r="1"/><circle cx="700" cy="400" r="2"/><circle cx="1050" cy="320" r="1"/>
    <circle cx="1300" cy="400" r="2"/><circle cx="1650" cy="350" r="1"/><circle cx="100" cy="600" r="2"/>
    <circle cx="400" cy="550" r="1"/><circle cx="650" cy="700" r="2"/><circle cx="1150" cy="600" r="1"/>
    <circle cx="1450" cy="650" r="2"/><circle cx="1750" cy="580" r="1"/><circle cx="300" cy="800" r="2"/>
    <circle cx="600" cy="850" r="1"/><circle cx="900" cy="900" r="2"/><circle cx="1200" cy="820" r="1"/>
    <circle cx="1500" cy="870" r="2"/><circle cx="1850" cy="800" r="1"/>
  </g>
  <!-- Central burst of light - digital manifestation -->
  <ellipse cx="960" cy="540" rx="200" ry="250" fill="#1155cc" opacity="0.15" filter="url(#bigGlow)"/>
  <ellipse cx="960" cy="540" rx="100" ry="130" fill="#2266ff" opacity="0.25" filter="url(#bigGlow)"/>
  <!-- Human silhouette dissolving into data streams -->
  <!-- Body (lower half) -->
  <g opacity="0.7" filter="url(#glow6)">
    <rect x="920" y="700" width="80" height="200" fill="#1144aa" rx="10"/>
    <!-- Torso -->
    <rect x="900" y="480" width="120" height="230" fill="#1a55cc" rx="15"/>
    <!-- Arms -->
    <rect x="800" y="490" width="100" height="60" fill="#1144aa" rx="15"/>
    <rect x="1020" y="490" width="100" height="60" fill="#1144aa" rx="15"/>
    <!-- Head -->
    <ellipse cx="960" cy="430" rx="70" ry="80" fill="#1a55cc"/>
  </g>
  <!-- Dissolving edges - data stream particles flowing outward -->
  <g fill="#4499ff" filter="url(#glow6)">
    <!-- Left dissolve -->
    <circle cx="840" cy="470" r="4" opacity="0.8"/>
    <circle cx="800" cy="440" r="3" opacity="0.6"/>
    <circle cx="760" cy="420" r="3" opacity="0.5"/>
    <circle cx="720" cy="400" r="2" opacity="0.4"/>
    <circle cx="680" cy="380" r="2" opacity="0.3"/>
    <circle cx="850" cy="520" r="4" opacity="0.8"/>
    <circle cx="810" cy="550" r="3" opacity="0.6"/>
    <circle cx="770" cy="580" r="3" opacity="0.5"/>
    <circle cx="730" cy="610" r="2" opacity="0.4"/>
    <!-- Right dissolve -->
    <circle cx="1080" cy="470" r="4" opacity="0.8"/>
    <circle cx="1120" cy="440" r="3" opacity="0.6"/>
    <circle cx="1160" cy="420" r="3" opacity="0.5"/>
    <circle cx="1200" cy="400" r="2" opacity="0.4"/>
    <circle cx="1240" cy="380" r="2" opacity="0.3"/>
    <circle cx="1070" cy="520" r="4" opacity="0.8"/>
    <circle cx="1110" cy="550" r="3" opacity="0.6"/>
    <circle cx="1150" cy="580" r="3" opacity="0.5"/>
    <circle cx="1190" cy="610" r="2" opacity="0.4"/>
    <!-- Top dissolve (head) -->
    <circle cx="960" cy="340" r="4" opacity="0.8"/>
    <circle cx="940" cy="300" r="3" opacity="0.6"/>
    <circle cx="980" cy="280" r="3" opacity="0.5"/>
    <circle cx="920" cy="260" r="2" opacity="0.4"/>
    <circle cx="1000" cy="240" r="2" opacity="0.4"/>
    <circle cx="950" cy="210" r="2" opacity="0.3"/>
  </g>
  <!-- Code streams flowing into the figure -->
  <g fill="#2277dd" font-family="monospace" font-size="12" opacity="0.35">
    <text x="500" y="400">01001000 01110101 01101101 01100001</text>
    <text x="500" y="420">01101110 00100000 01000011 01101111</text>
    <text x="1100" y="400">01100100 01100101 00100000 01001101</text>
    <text x="1100" y="420">01100101 01110010 01100111 01100101</text>
    <text x="400" y="650">CONSCIOUSNESS_TRANSFER = COMPLETE</text>
    <text x="1050" y="650">NEURAL_PATTERNS += DIGITAL_REALM</text>
  </g>
  <!-- Central glow from manifestation point -->
  <circle cx="960" cy="540" r="30" fill="#ffffff" opacity="0.15" filter="url(#bigGlow)"/>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 06</text>
</svg>
