<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0030"/>
      <stop offset="60%" stop-color="#0a0020"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg7)"/>
  <!-- Perspective grid - floor -->
  <g stroke="#220033" stroke-width="1" opacity="0.8">
    <!-- Converging lines from horizon point (960, 350) -->
    <line x1="960" y1="350" x2="0" y2="1080"/>
    <line x1="960" y1="350" x2="192" y2="1080"/>
    <line x1="960" y1="350" x2="384" y2="1080"/>
    <line x1="960" y1="350" x2="576" y2="1080"/>
    <line x1="960" y1="350" x2="768" y2="1080"/>
    <line x1="960" y1="350" x2="960" y2="1080"/>
    <line x1="960" y1="350" x2="1152" y2="1080"/>
    <line x1="960" y1="350" x2="1344" y2="1080"/>
    <line x1="960" y1="350" x2="1536" y2="1080"/>
    <line x1="960" y1="350" x2="1728" y2="1080"/>
    <line x1="960" y1="350" x2="1920" y2="1080"/>
  </g>
  <!-- Horizontal depth lines on floor -->
  <g stroke="#220033" stroke-width="1" opacity="0.5">
    <line x1="0" y1="1080" x2="1920" y2="1080"/>
    <line x1="100" y1="950" x2="1820" y2="950"/>
    <line x1="250" y1="820" x2="1670" y2="820"/>
    <line x1="400" y1="700" x2="1520" y2="700"/>
    <line x1="530" y1="590" x2="1390" y2="590"/>
    <line x1="660" y1="490" x2="1260" y2="490"/>
    <line x1="770" y1="410" x2="1150" y2="410"/>
  </g>
  <!-- Corrupted data conduits along the corridor walls -->
  <!-- Left wall conduits -->
  <g filter="url(#glow7)">
    <line x1="960" y1="350" x2="0" y2="1080" stroke="#660099" stroke-width="3"/>
    <line x1="960" y1="350" x2="192" y2="1080" stroke="#440066" stroke-width="2"/>
    <!-- Right wall conduits -->
    <line x1="960" y1="350" x2="1920" y2="1080" stroke="#660099" stroke-width="3"/>
    <line x1="960" y1="350" x2="1728" y2="1080" stroke="#440066" stroke-width="2"/>
  </g>
  <!-- Architectural structures on sides (corrupted walls) -->
  <!-- Left structures -->
  <g fill="#0d0018" stroke="#220033" stroke-width="1">
    <rect x="0" y="350" width="200" height="730"/>
    <rect x="0" y="350" width="150" height="730"/>
    <!-- Wall segments -->
    <rect x="0" y="400" width="180" height="40"/>
    <rect x="0" y="500" width="160" height="40"/>
    <rect x="0" y="600" width="170" height="40"/>
    <rect x="0" y="700" width="155" height="40"/>
    <rect x="0" y="800" width="165" height="40"/>
  </g>
  <!-- Right structures -->
  <g fill="#0d0018" stroke="#220033" stroke-width="1">
    <rect x="1720" y="350" width="200" height="730"/>
    <rect x="1770" y="350" width="150" height="730"/>
    <rect x="1740" y="400" width="180" height="40"/>
    <rect x="1760" y="500" width="160" height="40"/>
    <rect x="1750" y="600" width="170" height="40"/>
    <rect x="1765" y="700" width="155" height="40"/>
    <rect x="1755" y="800" width="165" height="40"/>
  </g>
  <!-- Red corruption glowing on walls -->
  <g filter="url(#glow7)" opacity="0.6">
    <rect x="0" y="450" width="80" height="6" fill="#cc0044"/>
    <rect x="0" y="540" width="70" height="4" fill="#aa0033"/>
    <rect x="0" y="630" width="85" height="5" fill="#cc0044"/>
    <rect x="1835" y="450" width="85" height="6" fill="#cc0044"/>
    <rect x="1850" y="540" width="70" height="4" fill="#aa0033"/>
    <rect x="1840" y="630" width="80" height="5" fill="#cc0044"/>
  </g>
  <!-- Distant tunnel glow (horizon) -->
  <ellipse cx="960" cy="350" rx="120" ry="80" fill="#660099" opacity="0.2" filter="url(#glow7)"/>
  <ellipse cx="960" cy="350" rx="60" ry="40" fill="#9900cc" opacity="0.3" filter="url(#glow7)"/>
  <ellipse cx="960" cy="350" rx="20" ry="14" fill="#cc33ff" opacity="0.6" filter="url(#glow7)"/>
  <!-- Floating error/corruption fragments -->
  <g fill="#440066" font-family="monospace" font-size="14" opacity="0.4">
    <text x="300" y="700">SECTOR_7: CORRUPT</text>
    <text x="1300" y="650">LAYER_4: BREACHED</text>
    <text x="500" y="850">CORE_DEFENSE: OFFLINE</text>
    <text x="1100" y="800">MEMORY_LEAK: CRITICAL</text>
    <text x="700" y="950">SYSTEM_INTEGRITY: 12%</text>
  </g>
  <!-- Vignette -->
  <radialGradient id="vig7" cx="50%" cy="50%" r="70%">
    <stop offset="50%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig7)"/>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 07</text>
</svg>
