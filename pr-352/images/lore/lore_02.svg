<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0005"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <!-- Circuit board grid -->
  <g stroke="#1a0a00" stroke-width="1" fill="none" opacity="0.6">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1080"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1000" y1="0" x2="1000" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1400" y1="0" x2="1400" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1800" y1="0" x2="1800" y2="1080"/>
  </g>
  <!-- Circuit traces -->
  <g stroke="#220500" stroke-width="2" fill="none">
    <path d="M 100 300 L 400 300 L 400 500 L 700 500"/>
    <path d="M 1400 200 L 1400 400 L 1100 400 L 1100 600 L 800 600"/>
    <path d="M 300 700 L 600 700 L 600 500 L 900 500"/>
    <path d="M 1600 800 L 1300 800 L 1300 600 L 1100 600"/>
  </g>
  <!-- Virus streams - corrupted red pathways -->
  <g filter="url(#glow2)">
    <!-- Primary infection stream left to right -->
    <path d="M 0 400 Q 300 380 600 420 Q 900 460 1200 400 Q 1500 340 1920 380" stroke="#cc2200" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M 0 420 Q 300 400 600 440 Q 900 480 1200 420 Q 1500 360 1920 400" stroke="#ff3300" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Secondary streams -->
    <path d="M 0 620 Q 400 600 800 640 Q 1200 680 1600 620 Q 1750 600 1920 610" stroke="#aa1800" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 200 0 Q 220 300 240 540 Q 260 700 280 1080" stroke="#cc2200" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 1600 0 Q 1620 200 1640 500 Q 1660 750 1680 1080" stroke="#aa1800" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- Virus nodes - spreading infection points -->
  <g fill="#ff2200" filter="url(#glow2)">
    <circle cx="400" cy="400" r="18" opacity="0.9"/>
    <circle cx="700" cy="430" r="12" opacity="0.8"/>
    <circle cx="1000" cy="400" r="20" opacity="1.0"/>
    <circle cx="1300" cy="380" r="15" opacity="0.85"/>
    <circle cx="600" cy="620" r="14" opacity="0.8"/>
    <circle cx="1200" cy="640" r="16" opacity="0.85"/>
    <circle cx="240" cy="300" r="10" opacity="0.7"/>
    <circle cx="1650" cy="450" r="11" opacity="0.75"/>
  </g>
  <!-- Corruption glyphs/fragments -->
  <g fill="#660000" font-family="monospace" font-size="14" opacity="0.5">
    <text x="350" y="350">0xDEAD</text>
    <text x="850" y="480">ERR_CORRUPT</text>
    <text x="1150" y="360">VIRUS-ZERO</text>
    <text x="550" y="580">FATAL</text>
    <text x="1050" y="700">REPLICATING...</text>
    <text x="200" y="750">INFECTED</text>
    <text x="1450" y="550">SPREADING</text>
  </g>
  <!-- Central VIRUS-ZERO logo -->
  <text x="960" y="520" font-family="monospace" font-size="72" font-weight="bold" fill="#330000" text-anchor="middle" filter="url(#glow2)" opacity="0.4">VIRUS-ZERO</text>
  <text x="960" y="520" font-family="monospace" font-size="72" font-weight="bold" fill="#ff1100" text-anchor="middle" opacity="0.85">VIRUS-ZERO</text>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 02</text>
</svg>
