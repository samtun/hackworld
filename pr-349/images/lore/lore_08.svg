<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00112a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0055cc" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0033aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft8">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg8)"/>
  <!-- Background data streams (subtle) -->
  <g stroke="#001133" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1920" y2="100"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="0" y1="700" x2="1920" y2="700"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>
  <!-- AI radial glow field -->
  <circle cx="960" cy="500" r="400" fill="url(#aiGlow)" filter="url(#glow8)"/>
  <!-- Mainframe AI form - geometric humanoid made of light -->
  <!-- Core (torso) -->
  <ellipse cx="960" cy="540" rx="80" ry="110" fill="#0044aa" opacity="0.8" filter="url(#soft8)"/>
  <ellipse cx="960" cy="540" rx="55" ry="80" fill="#0066cc" opacity="0.7" filter="url(#soft8)"/>
  <ellipse cx="960" cy="540" rx="30" ry="50" fill="#2288ff" opacity="0.9" filter="url(#glow8)"/>
  <!-- Head -->
  <circle cx="960" cy="380" r="80" fill="#0044aa" opacity="0.7" filter="url(#soft8)"/>
  <circle cx="960" cy="380" r="55" fill="#0066cc" opacity="0.8" filter="url(#soft8)"/>
  <circle cx="960" cy="380" r="30" fill="#3399ff" opacity="0.9" filter="url(#glow8)"/>
  <!-- Eyes (two bright points) -->
  <circle cx="940" cy="375" r="8" fill="#88ccff" filter="url(#glow8)"/>
  <circle cx="980" cy="375" r="8" fill="#88ccff" filter="url(#glow8)"/>
  <!-- Arms extending outward and upward -->
  <!-- Left arm -->
  <path d="M 890 510 Q 750 450 620 380 Q 520 330 400 290" stroke="#1166cc" stroke-width="8" fill="none" filter="url(#soft8)" opacity="0.8"/>
  <path d="M 890 510 Q 750 450 620 380 Q 520 330 400 290" stroke="#55aaff" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Right arm -->
  <path d="M 1030 510 Q 1170 450 1300 380 Q 1400 330 1520 290" stroke="#1166cc" stroke-width="8" fill="none" filter="url(#soft8)" opacity="0.8"/>
  <path d="M 1030 510 Q 1170 450 1300 380 Q 1400 330 1520 290" stroke="#55aaff" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Legs -->
  <path d="M 930 650 Q 900 750 880 880" stroke="#1166cc" stroke-width="8" fill="none" filter="url(#soft8)" opacity="0.8"/>
  <path d="M 990 650 Q 1020 750 1040 880" stroke="#1166cc" stroke-width="8" fill="none" filter="url(#soft8)" opacity="0.8"/>
  <!-- Data ribbons flowing from AI form -->
  <g stroke="#0055cc" stroke-width="2" fill="none" opacity="0.5" filter="url(#soft8)">
    <path d="M 400 290 Q 200 250 100 200 Q 50 170 0 150"/>
    <path d="M 1520 290 Q 1720 250 1820 200 Q 1870 170 1920 150"/>
    <path d="M 880 880 Q 800 950 700 1000 Q 600 1040 500 1080"/>
    <path d="M 1040 880 Q 1120 950 1220 1000 Q 1320 1040 1420 1080"/>
  </g>
  <!-- Floating data orbs around the AI -->
  <g filter="url(#glow8)">
    <circle cx="700" cy="300" r="12" fill="#2266cc" opacity="0.8"/>
    <circle cx="1220" cy="280" r="10" fill="#2266cc" opacity="0.7"/>
    <circle cx="600" cy="600" r="8" fill="#1144aa" opacity="0.8"/>
    <circle cx="1350" cy="550" r="9" fill="#1144aa" opacity="0.7"/>
    <circle cx="750" cy="800" r="7" fill="#2255bb" opacity="0.7"/>
    <circle cx="1180" cy="780" r="8" fill="#2255bb" opacity="0.8"/>
  </g>
  <!-- AI text/signal -->
  <text x="960" y="950" font-family="monospace" font-size="20" fill="#1155aa" text-anchor="middle" opacity="0.7" filter="url(#soft8)">MAINFRAME AI — SYSTEM GUARDIAN — ONLINE</text>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 08</text>
</svg>
