<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="portGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0022aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg5)"/>
  <!-- Head silhouette (profile/back view) - centered -->
  <!-- Neck -->
  <rect x="880" y="820" width="160" height="200" fill="#080015"/>
  <!-- Shoulder line -->
  <rect x="500" y="880" width="920" height="200" fill="#060012" rx="20"/>
  <!-- Head -->
  <ellipse cx="960" cy="620" rx="200" ry="230" fill="#0a0018"/>
  <!-- Hair/top of head -->
  <ellipse cx="960" cy="420" rx="180" ry="60" fill="#080015"/>
  <!-- Neural port area on back of skull -->
  <circle cx="960" cy="680" r="45" fill="#0f0025"/>
  <circle cx="960" cy="680" r="35" fill="#150030"/>
  <!-- Port glow -->
  <circle cx="960" cy="680" r="60" fill="url(#portGlow)" opacity="0.8" filter="url(#glow5)"/>
  <!-- Port detail rings -->
  <circle cx="960" cy="680" r="30" fill="none" stroke="#3366cc" stroke-width="3"/>
  <circle cx="960" cy="680" r="20" fill="none" stroke="#5588ff" stroke-width="2"/>
  <circle cx="960" cy="680" r="10" fill="#2244aa"/>
  <!-- Neural cable going upward/off screen -->
  <path d="M 960 645 Q 960 560 1000 480 Q 1040 400 1020 300 Q 1000 200 960 100 Q 940 50 960 0" stroke="#4477cc" stroke-width="6" fill="none" filter="url(#softGlow)"/>
  <path d="M 960 645 Q 960 560 1000 480 Q 1040 400 1020 300 Q 1000 200 960 100 Q 940 50 960 0" stroke="#88aaff" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Cable data streams (small lights running along the cable) -->
  <g fill="#aaccff" filter="url(#glow5)" opacity="0.7">
    <circle cx="963" cy="600" r="3"/>
    <circle cx="968" cy="545" r="3"/>
    <circle cx="974" cy="490" r="3"/>
    <circle cx="985" cy="435" r="3"/>
    <circle cx="993" cy="380" r="3"/>
    <circle cx="985" cy="325" r="3"/>
    <circle cx="975" cy="275" r="3"/>
    <circle cx="965" cy="220" r="3"/>
    <circle cx="960" cy="165" r="3"/>
  </g>
  <!-- Ambient blue glow behind head -->
  <ellipse cx="960" cy="630" rx="280" ry="300" fill="#1133aa" opacity="0.08" filter="url(#glow5)"/>
  <!-- Clinical background hints (blurred) -->
  <g opacity="0.15">
    <rect x="100" y="400" width="200" height="400" fill="#111133" rx="5"/>
    <rect x="1620" y="400" width="200" height="400" fill="#111133" rx="5"/>
  </g>
  <!-- Vignette -->
  <radialGradient id="vig5" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000008"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig5)"/>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 05</text>
</svg>
