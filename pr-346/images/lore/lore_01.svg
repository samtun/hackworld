    <line x1="400" y1="0" x2="380" y2="200"/>
    <line x1="600" y1="0" x2="580" y2="200"/>
    <line x1="800" y1="0" x2="780" y2="200"/>
    <line x1="1100" y1="0" x2="1080" y2="200"/>
    <line x1="1300" y1="0" x2="1280" y2="200"/>
    <line x1="1500" y1="0" x2="1480" y2="200"/>
    <line x1="1700" y1="0" x2="1680" y2="200"/>
    <line x1="300" y1="100" x2="280" y2="300"/>
    <line x1="700" y1="50" x2="680" y2="250"/>
    <line x1="1000" y1="80" x2="980" y2="280"/>
    <line x1="1400" y1="30" x2="1380" y2="230"/>
    <line x1="1600" y1="70" x2="1580" y2="270"/>
  </g>
  <!-- Ground reflection -->
  <rect x="0" y="600" width="1920" height="2" fill="#1a3a6a" opacity="0.5"/>
  <!-- Placeholder label -->
  <text x="1880" y="30" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 01</text>
