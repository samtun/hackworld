<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#000008"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <!-- City skyline silhouette -->
  <rect x="0" y="600" width="1920" height="480" fill="#03080f"/>
  <rect x="100" y="520" width="80" height="80" fill="#050d1a"/>
  <rect x="200" y="480" width="60" height="120" fill="#050d1a"/>
  <rect x="300" y="440" width="100" height="160" fill="#060e1c"/>
  <rect x="430" y="400" width="70" height="200" fill="#060e1c"/>
  <rect x="530" y="460" width="50" height="140" fill="#050d1a"/>
  <rect x="610" y="380" width="90" height="220" fill="#060e1c"/>
  <rect x="730" y="300" width="60" height="300" fill="#070f1e"/>
  <rect x="820" y="350" width="45" height="250" fill="#060e1c"/>
  <rect x="900" y="270" width="120" height="330" fill="#08101f"/>
  <rect x="1050" y="320" width="80" height="280" fill="#070f1e"/>
  <rect x="1160" y="380" width="55" height="220" fill="#060e1c"/>
