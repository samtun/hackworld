  <rect x="1690" y="450" width="50" height="150" fill="#050d1a"/>
  <rect x="1770" y="500" width="80" height="100" fill="#050d1a"/>
  <!-- Main tower (OMETEC HQ) -->
  <rect x="840" y="80" width="240" height="520" fill="#0a1428"/>
  <rect x="860" y="100" width="200" height="480" fill="#0d1a32"/>
  <!-- Tower windows grid -->
  <g fill="#1a4080" opacity="0.7">
    <rect x="875" y="120" width="20" height="10"/><rect x="905" y="120" width="20" height="10"/>
    <rect x="935" y="120" width="20" height="10"/><rect x="965" y="120" width="20" height="10"/>
    <rect x="995" y="120" width="20" height="10"/><rect x="1025" y="120" width="20" height="10"/>
    <rect x="875" y="145" width="20" height="10"/><rect x="905" y="145" width="20" height="10"/>
    <rect x="935" y="145" width="20" height="10"/><rect x="965" y="145" width="20" height="10"/>
    <rect x="995" y="145" width="20" height="10"/><rect x="1025" y="145" width="20" height="10"/>
    <rect x="875" y="170" width="20" height="10"/><rect x="905" y="170" width="20" height="10"/>
    <rect x="935" y="170" width="20" height="10"/><rect x="965" y="170" width="20" height="10"/>
    <rect x="995" y="170" width="20" height="10"/><rect x="1025" y="170" width="20" height="10"/>
  </g>
  <!-- Lit windows -->
  <g fill="#4a9fff" opacity="0.9">
    <rect x="905" y="195" width="20" height="10"/><rect x="965" y="210" width="20" height="10"/>
    <rect x="935" y="230" width="20" height="10"/><rect x="1005" y="240" width="20" height="10"/>
    <rect x="875" y="260" width="20" height="10"/><rect x="935" y="275" width="20" height="10"/>
    <rect x="995" y="290" width="20" height="10"/><rect x="875" y="310" width="20" height="10"/>
  </g>
  <!-- OMETEC logo glow -->
  <text x="960" y="500" font-family="monospace" font-size="42" font-weight="bold" fill="#2266cc" opacity="0.9" text-anchor="middle" filter="url(#glow1)">OMETEC</text>
  <text x="960" y="500" font-family="monospace" font-size="42" font-weight="bold" fill="#5599ff" text-anchor="middle">OMETEC</text>
  <text x="960" y="535" font-family="monospace" font-size="16" fill="#3366aa" text-anchor="middle" letter-spacing="8">CORPORATION</text>
  <!-- Antenna -->
  <line x1="960" y1="80" x2="960" y2="20" stroke="#1a3a6a" stroke-width="3"/>
  <circle cx="960" cy="18" r="4" fill="#ff4444" opacity="0.8"/>
  <!-- Rain effect -->
  <g stroke="#1a3a6a" stroke-width="0.5" opacity="0.3">
