<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000d1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="heroGlow" cx="50%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#0044bb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="fortGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#550000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow10">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow10">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg10)"/>
  <!-- Corrupted fortress in the background (massive structure) -->
  <!-- Main fortress body -->
  <rect x="400" y="100" width="1120" height="700" fill="#080010" opacity="0.9"/>
  <rect x="450" y="120" width="1020" height="650" fill="#060010"/>
  <!-- Fortress towers -->
  <rect x="380" y="60" width="120" height="200" fill="#0a0015"/>
  <rect x="1420" y="60" width="120" height="200" fill="#0a0015"/>
  <rect x="580" y="80" width="80" height="160" fill="#080012"/>
  <rect x="1260" y="80" width="80" height="160" fill="#080012"/>
  <!-- Corruption cracks and red glow on fortress -->
  <g filter="url(#glow10)">
    <line x1="600" y1="150" x2="650" y2="300" stroke="#cc0033" stroke-width="3" opacity="0.7"/>
    <line x1="900" y1="120" x2="880" y2="280" stroke="#aa0022" stroke-width="2" opacity="0.6"/>
    <line x1="1200" y1="160" x2="1250" y2="320" stroke="#cc0033" stroke-width="3" opacity="0.7"/>
    <line x1="1450" y1="140" x2="1420" y2="290" stroke="#aa0022" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Red fortress glow overlay -->
  <rect x="400" y="100" width="1120" height="700" fill="url(#fortGlow)"/>
  <!-- Fortress windows - red glow -->
  <g fill="#880022" filter="url(#glow10)" opacity="0.7">
    <rect x="520" y="200" width="60" height="40"/>
    <rect x="620" y="200" width="60" height="40"/>
    <rect x="720" y="200" width="60" height="40"/>
    <rect x="820" y="200" width="60" height="40"/>
    <rect x="920" y="200" width="60" height="40"/>
    <rect x="1020" y="200" width="60" height="40"/>
    <rect x="1120" y="200" width="60" height="40"/>
    <rect x="1220" y="200" width="60" height="40"/>
    <rect x="1320" y="200" width="60" height="40"/>
    <rect x="570" y="280" width="60" height="40"/>
    <rect x="720" y="280" width="60" height="40"/>
    <rect x="920" y="280" width="60" height="40"/>
    <rect x="1120" y="280" width="60" height="40"/>
    <rect x="1270" y="280" width="60" height="40"/>
  </g>
  <!-- Ground/floor - digital grid -->
  <rect x="0" y="750" width="1920" height="330" fill="#000508"/>
  <g stroke="#001122" stroke-width="1" opacity="0.5">
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="850" x2="1920" y2="850"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="950" x2="1920" y2="950"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
    <line x1="200" y1="750" x2="200" y2="1080"/>
    <line x1="400" y1="750" x2="400" y2="1080"/>
    <line x1="600" y1="750" x2="600" y2="1080"/>
    <line x1="800" y1="750" x2="800" y2="1080"/>
    <line x1="1000" y1="750" x2="1000" y2="1080"/>
    <line x1="1200" y1="750" x2="1200" y2="1080"/>
    <line x1="1400" y1="750" x2="1400" y2="1080"/>
    <line x1="1600" y1="750" x2="1600" y2="1080"/>
    <line x1="1800" y1="750" x2="1800" y2="1080"/>
  </g>
  <!-- Hero player character - glowing digital warrior (silhouette + blue aura) -->
  <!-- Hero glow -->
  <ellipse cx="960" cy="780" rx="120" ry="180" fill="url(#heroGlow)"/>
  <circle cx="960" cy="750" r="80" fill="#0033aa" opacity="0.15" filter="url(#bigGlow10)"/>
  <!-- Hero silhouette -->
  <g filter="url(#glow10)">
    <!-- Legs -->
    <rect x="935" y="860" width="30" height="100" fill="#0055cc" rx="5"/>
    <rect x="975" y="860" width="30" height="100" fill="#0055cc" rx="5"/>
    <!-- Body -->
    <rect x="920" y="720" width="120" height="150" fill="#0066dd" rx="8"/>
    <!-- Arms (combat stance) -->
    <rect x="870" y="725" width="50" height="30" fill="#0055cc" rx="5"/>
    <rect x="1000" y="725" width="50" height="30" fill="#0055cc" rx="5"/>
    <!-- Head -->
    <ellipse cx="960" cy="700" rx="40" ry="45" fill="#0077ee"/>
    <!-- Eye glow -->
    <circle cx="948" cy="698" r="6" fill="#aaddff" filter="url(#glow10)"/>
    <circle cx="972" cy="698" r="6" fill="#aaddff" filter="url(#glow10)"/>
    <!-- Hero aura lines -->
    <line x1="910" y1="720" x2="870" y2="680" stroke="#3388ff" stroke-width="2" opacity="0.6"/>
    <line x1="1010" y1="720" x2="1050" y2="680" stroke="#3388ff" stroke-width="2" opacity="0.6"/>
    <line x1="960" y1="660" x2="960" y2="620" stroke="#3388ff" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Hero ground glow -->
  <ellipse cx="960" cy="960" rx="100" ry="20" fill="#002288" opacity="0.3" filter="url(#bigGlow10)"/>
  <!-- Threat indicator - countdown -->
  <text x="960" y="60" font-family="monospace" font-size="24" fill="#cc0000" text-anchor="middle" opacity="0.8" filter="url(#glow10)">SYSTEM COLLAPSE IMMINENT</text>
  <!-- Vignette -->
  <radialGradient id="vig10" cx="50%" cy="50%" r="70%">
    <stop offset="40%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig10)"/>
  <!-- Placeholder label -->
  <text x="1880" y="1070" font-family="monospace" font-size="12" fill="#333" text-anchor="end" opacity="0.5">PLACEHOLDER 10</text>
</svg>
